summary: "I studied at the University of Toronto (BSc, then MEng focused on analytics/ML), and I'm a data/analytics-oriented engineer with hands-on experience in enterprise ETL pipelines, data integration, quality assurance, and applied machine learning. On the technical side, I work most comfortably in Python, Java, Linux/Bash, and SQL/RDBMS, with experience using PySpark, Databricks, Airflow, NiFi, Docker, and Azure for data workloads. I have built end-to-end systems including quantitative and ML applications in Python, and database/web apps with designed schemas and CRUD logic. At RBC Wealth Management, I maintained dozens of daily ETL pipelines, developed new data workflows, integrated Collibra REST APIs with PostgreSQL using SCD Type 2, and performed data quality validation, troubleshooting, and testing within enterprise SDLC and change management processes. My previous experience includes marketplace data analysis, pricing tools, SellerCloud, and repricing workflows at GiftCash, as well as full QA cycles using Selenium, HP ALM, PL/SQL, and Azure DevOps at the Ministry of Education. I enjoy practical, collaborative, data-first environments and focus on demonstrating execution, not just listing tools."

