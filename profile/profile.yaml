# List of Jarvis projects
jarvis_projects:
  - name: "Cluster Monitor"
    git_url: "/linux_sql"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: "Built a lightweight Linux cluster monitoring solution that collects host hardware info and minute-level resource metrics with Bash scripts and ships them to a centralized PostgreSQL instance running in Docker. Automated data ingestion with cron, standardized the schema with SQL DDL, and provided sample analytical queries for capacity planning and troubleshooting. Tech stack: Bash, Docker, PostgreSQL, cron, Git/GitFlow, Linux command-line tools (lscpu, vmstat, df, awk)."
  - name: "Core Java Apps"
    git_url: "/core_java"
    description: "Built a Java command-line “grep” application and integrated it into a complete Maven/IntelliJ workflow. Started by treating the provided demo JAR as a black box to confirm expected behavior (given a regex, root directory, and output file, recursively walk files, match lines, and write hits to the output), then practiced Java regex by implementing the RegexExc interface (e.g., validating JPEG filenames, simplified IP addresses, and empty lines). Designed a JavaGrep interface with JavaGrepImp where process() orchestrates the pipeline—list files under rootPath, read line-by-line, filter via containsPattern, and write matches—using SLF4J with a log4j binding for structured logging. Extended the project with Java 8 streams/lambdas by implementing LambdaStreamExc in LambdaStreamImp and building JavaGrepLambdaImp, replacing loops with Files.walk and Files.lines stream pipelines. Packaged the app with Maven Shade, containerized it with a Dockerfile based on OpenJDK 8, built a <docker_user>/grep image, tested locally with mounted data/log volumes, and pushed the image to Docker Hub. Tech stack: Java, Maven (Shade), IntelliJ, SLF4J/log4j, Java 8 Streams/Lambdas, Docker (OpenJDK 8), Git/GitFlow."
  - name: "Python Data Analytics"
    git_url: "/python_data_anlytics"
    description: "Implemented a retail data analytics workflow by setting up a Docker-based Python/Jupyter environment and connecting to the Jarvis PostgreSQL data warehouse via psycopg2/SQLAlchemy to load the retail transaction table into Pandas. Explored and validated the dataset with SQL queries plus pd.read_sql/pd.read_csv, then built an end-to-end analytics notebook that computes invoice-level totals, visualizes invoice amount distributions (full data and trimmed to the first 85% quantiles), and produces core business KPIs (total orders, unique customers, unique SKUs, total revenue, and monthly revenue by YYYYMM). Extended the analysis with time-series and customer lifecycle features—monthly placed vs. canceled orders, monthly sales and sales growth, monthly active users, and new vs. existing users—and integrated an RFM-style customer value segmentation to support targeted retention and marketing decisions. Tech stack: Python, Jupyter Notebook, Pandas, NumPy, Matplotlib, SQL, PostgreSQL (Jarvis PSQL), psycopg2, SQLAlchemy, Docker, Git."
  - name: "PySpark Pipeline"
    git_url: "/equity-market-etl"
    description: "Built an end-to-end equity-market ETL and analytics pipeline that ingests per-ticker daily OHLCV CSVs plus a company dimension table, standardizes them into a Raw → Bronze → Silver → Gold medallion layout, and produces analytics-ready datasets to rank “strong opportunities” by recent performance and risk. Orchestrated the workflow with an Airflow DAG running Spark jobs in Docker, enforced fail-fast data quality gates (schema/emptiness, unique ticker-date, valid prices/volumes, trading-day completeness, referential integrity for sector/industry), and persisted audit/quarantine artifacts with dataset/rule/column diagnostics for reproducibility. Generated Gold outputs including enriched price series with daily returns and rolling metrics, plus sector and industry analytics tables (e.g., sector_daily_returns, industry_volatility) for downstream screening and reporting. Tech stack: Python, PySpark, Apache Spark, Apache Airflow, Docker/Docker Compose, PostgreSQL, Parquet, exchange-calendars, SQL, pytest, Git."


# List of personal or academic projects
# Feel free to add more projects
highlighted_projects:
    #project name
  - name: "Adaptive Laddered ETF Momentum Strategy for Portfolio Optimization"
    #URL is optional
    git_url:
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: Built a laddered momentum ETF strategy that used time-diversified tranches to enhance returns while reducing volatility and drawdowns; implemented a 2-tranche system with staggered 2-week investments to balance momentum capture and trend responsiveness; backtested the strategy on sector ETFs (2020-2024) in Python and showed outperformance over SPY on risk-adjusted metrics (Sharpe/Sortino) with lower drawdowns; and automated weekly ETF selection plus reporting to demonstrate the laddering effectiveness for momentum portfolios.
  - name: "Innovation Strategy Development for Canada"
    git_url:
    description: Guided an innovation-strategy study that compared Canada's innovation strengths (R&D, talent, institutions) with leading countries using Global Innovation Index data; collected and cleaned fragmented country-level innovation indicators to increase dataset reliability in Python (Pandas, Seaborn); applied clustering and feature-importance modeling to identify key drivers of innovation success across 100+ indicators; and developed an AI chatbot (Langflow + LLM) to deliver interactive insights and authored actionable policy recommendations.
  - name: "Deepfake Detection with CNNs and Object Detection"
    git_url:
    description: Built a deepfake-detection pipeline using CNNs (InceptionV3, Xception, etc.) trained on 190K+ real/synthetic facial images; boosted accuracy by integrating YOLOv1 for face detection before classification; optimized performance through data augmentation and hyperparameter tuning while preventing overfitting; and tested model fairness across demographic groups and synthetic media types (GANs, StyleGAN).
  - name: "Machine Learning Pipeline for Weekly Return Forecasting in Equity Markets"
    git_url:
    description: Built a Python-based weekly equity-return forecasting system that enhanced a textbook model with novel volatility/wavelet features; curated multi-asset data (Yahoo Finance/FRED) and engineered a boosted pipeline with Ridge/Elastic Net/Bayesian modeling; validated the models using Sharpe Ratio, Profit Factor, and anti-overfitting techniques (bootstrapping/Monte Carlo); and delivered a 40-slide presentation plus technical notebook that showed a production-ready ML workflow for finance.
  - name: "APOPO Project on Rat Odor Preference Behavior for Landmine Detection"
    git_url:
    description: Partnered with APOPO to analyze rat-training video data and assessed how early exposure affects odor-preference behavior for landmine detection; processed large volumes of video-derived behavioral metrics to ensure reliability before statistical modeling; used PCA and mixed-effects models to identify key training factors and optimized model selection for interpretability; and delivered training recommendations and co-authored a report to enhance APOPO's conditioning program.
  - name: "Bullet Journal Webpage Application"
    git_url: "https://github.com/UTSCCSCC01/finalprojects22-cyclist"
    description: Built a bullet-journal web app using Angular and Agile/Scrum, finishing frontend tasks from the backlog so the UI stood out from other diary apps; conducted user-centric testing to keep the features aligned with stakeholder standards and reported issues to the team for timely fixes; and tracked project progress with CI/CD tools, shared workflows, and collaboration with frontend/QA teams via Zoom, GitHub, and Discord.
  - name: "MyBnB Database Design Project"
    git_url: "https://github.com/tianpai/CSCC43-project-2022-summer"
    description: Simulated core MyBnB operations (booking, rating, etc.) in SQL to better practice relational modeling and understand how real apps leverage databases; designed and developed a rental platform schema with normalized Java + SQL access so users could interact with the formulated database; and led the team by assigning tasks and supervising delivery to make sure features were finished in time for integration testing.

