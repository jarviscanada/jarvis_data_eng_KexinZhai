<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="980" height="520" viewBox="0 0 980 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill:#f5f5f5; stroke:#333; stroke-width:1.5; rx:10; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size:16px; font-weight:bold; fill:#111; }
      .text { font-family: Arial, Helvetica, sans-serif; font-size:13px; fill:#111; }
      .arrow { stroke:#333; stroke-width:2; marker-end: url(#arrowhead); fill:none; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="20" y="30" class="title">Linux Cluster Monitoring Agent — Architecture</text>
  <text x="20" y="50" class="text">Three Linux hosts run agents that push data to a Dockerized PostgreSQL with a persistent volume. Cron schedules host_usage sampling.</text>

  <!-- Host boxes -->
  <rect x="40"  y="100" width="240" height="140" class="box"/>
  <text x="60"  y="130" class="title">Host A</text>
  <text x="60"  y="155" class="text">linux host</text>
  <text x="60"  y="175" class="text">agent: host_info.sh / host_usage.sh</text>

  <rect x="40"  y="270" width="240" height="140" class="box"/>
  <text x="60"  y="300" class="title">Host B</text>
  <text x="60"  y="325" class="text">linux host</text>
  <text x="60"  y="345" class="text">agent: host_info.sh / host_usage.sh</text>

  <rect x="340" y="185" width="240" height="140" class="box"/>
  <text x="360" y="215" class="title">Host C</text>
  <text x="360" y="240" class="text">linux host</text>
  <text x="360" y="260" class="text">agent: host_info.sh / host_usage.sh</text>

  <!-- DB box -->
  <rect x="680" y="185" width="260" height="170" class="box"/>
  <text x="700" y="215" class="title">PostgreSQL (Docker)</text>
  <text x="700" y="240" class="text">image: postgres</text>
  <text x="700" y="260" class="text">volume: pgdata → /var/lib/postgresql/data</text>
  <text x="700" y="280" class="text">tables: host_info, host_usage</text>

  <!-- Volume symbol -->
  <rect x="700" y="300" width="60" height="40" class="box"/>
  <text x="710" y="325" class="text">volume</text>

  <!-- Arrows -->
  <path d="M 280 170 C 420 170, 560 220, 680 250" class="arrow"/>
  <path d="M 280 340 C 420 340, 560 300, 680 260" class="arrow"/>
  <path d="M 580 255 C 630 255, 650 255, 680 255" class="arrow"/>

  <!-- Legend -->
  <rect x="40" y="440" width="900" height="60" class="box"/>
  <text x="60" y="465" class="text">Legend:</text>
  <text x="130" y="465" class="text">Agents send host_info (one-time) and host_usage (cron, every minute) to PostgreSQL.</text>
  <text x="60" y="485" class="text">Data persists in a named volume; queries.sql provides business analytics queries.</text>

</svg>
